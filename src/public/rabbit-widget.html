<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif;color:#fff}.gem{position:absolute;right:12px;bottom:12px;width:42px;height:42px;padding:0;border:1px solid #fff8;border-radius:50% 50% 45% 55%;background:linear-gradient(135deg,#b6ff00 0 32%,#7a00ff 33% 62%,#ff00aa 63%);box-shadow:inset -3px -3px 0 #fff8,2px 3px 0 #ff00aa;transform:rotate(18deg);cursor:pointer}.gem:after{content:'◆';font-size:20px;color:#fff;position:absolute;inset:0;display:grid;place-items:center;transform:rotate(-18deg);text-shadow:0 1px 2px #09090d}.gem:focus-visible,.row button:focus-visible,.close:focus-visible{outline:3px solid #fff200;outline-offset:3px}.panel{display:none;position:absolute;right:12px;bottom:12px;width:min(290px,calc(100% - 24px));padding:14px 16px;border:2px solid #ff00aa;box-shadow:6px 6px #7a00ff;background:#09090df2;border-radius:12px;box-sizing:border-box}.panel.open{display:block}.panel strong{color:#fff200}.panel p{font-size:13px;margin:5px 0 9px}.row{display:flex;gap:7px;flex-wrap:wrap}.row button{padding:8px 10px;border-radius:7px;background:#fff200;color:#09090d;border:1px solid #fff;font-weight:800;cursor:pointer}.row button:disabled{cursor:not-allowed;filter:grayscale(1);opacity:.55}.close{float:right;background:none!important;color:#fff!important;border:0!important;font-size:18px!important;padding:0!important}
</style></head><body><button class="gem" id="g" type="button" aria-label="Open Rabbit Hole" aria-controls="p" aria-expanded="false"></button><section class="panel" id="p" role="dialog" aria-modal="true" aria-labelledby="rabbitTitle"><button class="close" id="x" type="button" aria-label="Close Rabbit Hole">×</button><strong id="rabbitTitle">THE RABBIT HOLE</strong><p>Find the 50 restless forest buttons. Member progress is saved securely.</p><div id="count" style="color:#fff200;font-weight:bold;margin:7px 0">0 / 50</div><div class="row"><button id="c" type="button" disabled title="Find all 50 hidden buttons to unlock the cave">Enter cave</button><button id="f" type="button">Forest</button><button id="d" type="button">30-day clue</button></div><p id="status" aria-live="polite"></p></section><script>
const send=(action)=>parent.postMessage({type:'rabbit-hole-action',action},'*');const openPanel=()=>{p.classList.add('open');g.setAttribute('aria-expanded','true');x.focus()};const closePanel=()=>{p.classList.remove('open');g.setAttribute('aria-expanded','false');g.focus()};g.onclick=openPanel;x.onclick=closePanel;c.onclick=()=>send('enter-cave');f.onclick=()=>send('forest');d.onclick=()=>send('daily-clue');document.addEventListener('keydown',e=>{if(!p.classList.contains('open'))return;if(e.key==='Escape')closePanel();if(e.key==='Tab'){const controls=[...p.querySelectorAll('button:not(:disabled)')];const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});window.addEventListener('message',e=>{if(e.source!==parent)return;const d=e.data||{};if(d.type==='RABBIT_WIDGET_RESULT'){status.textContent=d.ok?'Rabbit Hole ready.':(d.error==='MEMBER_LOGIN_REQUIRED'?'Sign in through Account to continue.':(d.error||'Action failed'));if(d.payload?.found!==undefined){count.textContent=d.payload.found+' / '+d.payload.required;c.disabled=!d.payload.caveUnlocked;c.title=d.payload.caveUnlocked?'Enter the unlocked cave':'Find all 50 hidden buttons to unlock the cave'}}});send('state');
</script></body></html>
