<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif;color:#fff}.gem{position:absolute;right:12px;bottom:12px;width:42px;height:42px;padding:0;border:1px solid #fff8;border-radius:50% 50% 45% 55%;background:linear-gradient(135deg,#b6ff00 0 32%,#7a00ff 33% 62%,#ff00aa 63%);box-shadow:inset -3px -3px 0 #fff8,2px 3px 0 #ff00aa;transform:rotate(18deg);cursor:pointer}.gem:after{content:'◆';font-size:20px;color:#fff;position:absolute;inset:0;display:grid;place-items:center;transform:rotate(-18deg);text-shadow:0 1px 2px #09090d}.gem:focus-visible,.row button:focus-visible,.primary:focus-visible,.close:focus-visible{outline:3px solid #fff200;outline-offset:3px}.panel{display:none;position:absolute;right:12px;bottom:12px;width:min(320px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;padding:14px 16px;border:2px solid #ff00aa;box-shadow:6px 6px #7a00ff;background:#09090df2;border-radius:12px;box-sizing:border-box}.panel.open{display:block}.panel strong{color:#fff200}.panel p{font-size:13px;margin:5px 0 9px}.close{float:right;background:none!important;color:#fff!important;border:0!important;font-size:18px!important;padding:0!important}.dashboard{margin:10px 0;padding:10px;border:1px solid #37e8ff66;border-radius:10px;background:#151522}.identity{color:#37e8ff;font-size:12px;margin-top:3px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.stat{padding:7px;border-radius:7px;background:#242438;font-size:11px}.stat b{display:block;color:#fff200;font-size:13px;margin-top:2px}.progress{height:8px;border-radius:999px;background:#ffffff22;overflow:hidden;margin:7px 0}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#37e8ff,#b6ff00,#ff00aa)}.reward{font-size:11px;color:#f7c7ff;margin:8px 0}.primary{width:100%;padding:9px 10px;border-radius:8px;background:#ff00aa;color:#fff;border:1px solid #fff;font-weight:800;cursor:pointer}.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.row button{padding:7px 9px;border-radius:7px;background:#fff200;color:#09090d;border:1px solid #fff;font-weight:800;cursor:pointer;font-size:11px}.row button:disabled{cursor:not-allowed;filter:grayscale(1);opacity:.55}.signed-out{color:#fff200}.loading{opacity:.75}
</style></head><body><button class="gem" id="g" type="button" aria-label="Open Rabbit Hole member dashboard" aria-controls="p" aria-expanded="false"></button><section class="panel" id="p" role="dialog" aria-modal="true" aria-labelledby="rabbitTitle"><button class="close" id="x" type="button" aria-label="Close Rabbit Hole">×</button><strong id="rabbitTitle">DOPAHQ · RABBIT HOLE</strong><p>Your private path through the forest.</p><div class="dashboard loading" id="dashboard" aria-busy="true"><b id="rank">Loading your path…</b><div class="identity" id="identity"></div><div class="stats"><div class="stat">Progress<b id="count">0 / 50</b></div><div class="stat">Dopa XP<b id="xp">0 XP</b></div><div class="stat">Forest<b id="forest">0 encounters</b></div><div class="stat">Riddles<b id="daily">0 / 0</b></div></div><div class="progress" role="progressbar" aria-label="Rabbit Hole progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="bar"></span></div><div class="reward" id="reward">Treasure locked</div><button class="primary" id="n" type="button">Continue the hunt</button></div><div class="row"><button id="c" type="button" disabled title="Find all 50 hidden buttons to unlock the cave">Enter cave</button><button id="f" type="button">Forest</button><button id="d" type="button">30-day clue</button></div><p id="status" aria-live="polite"></p></section><script src="rabbitDashboardView.js"></script><script>
const statusNode=document.getElementById('status');const send=(action)=>parent.postMessage({type:'rabbit-hole-action',action},'*');const openPanel=()=>{p.classList.add('open');g.setAttribute('aria-expanded','true');x.focus();send('dashboard')};const closePanel=()=>{p.classList.remove('open');g.setAttribute('aria-expanded','false');g.focus()};const text=(node,value)=>{node.textContent=String(value||'')};const clearDashboard=()=>{text(xp,'0 XP');text(count,'0 / 50');text(forest,'0 encounters');text(daily,'0 / 0');text(reward,'Treasure locked');text(n,'Continue the hunt');n.disabled=true;bar.style.width='0%';bar.parentElement.setAttribute('aria-valuenow','0');c.disabled=true;c.title='Find all 50 hidden buttons to unlock the cave'};const renderDashboard=snapshot=>{const view=RabbitDashboardView.buildDashboardView(snapshot);dashboard.classList.remove('loading');dashboard.setAttribute('aria-busy','false');if(!view.signedIn){clearDashboard();text(rank,'Member sign-in required');text(identity,'Use Account to sign in, then reopen the gem.');statusNode.classList.add('signed-out');return}statusNode.classList.remove('signed-out');text(rank,view.rank);text(identity,view.identity);text(xp,view.xp);text(count,view.progress);text(forest,view.forest);text(daily,view.daily);text(reward,view.reward);text(n,view.primary.label);n.disabled=false;bar.style.width=view.percent+'%';bar.parentElement.setAttribute('aria-valuenow',String(view.percent));c.disabled=view.percent<100;c.title=view.percent>=100?'Enter the unlocked cave':'Find all 50 hidden buttons to unlock the cave'};g.onclick=openPanel;x.onclick=closePanel;n.onclick=()=>send('dashboard-next');c.onclick=()=>send('enter-cave');f.onclick=()=>send('forest');d.onclick=()=>send('daily-clue');document.addEventListener('keydown',e=>{if(!p.classList.contains('open'))return;if(e.key==='Escape')closePanel();if(e.key==='Tab'){const controls=[...p.querySelectorAll('button:not(:disabled)')];const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});window.addEventListener('message',e=>{if(e.source!==parent)return;const message=e.data||{};if(message.type!=='RABBIT_WIDGET_RESULT')return;if(message.action==='dashboard'){if(message.ok){renderDashboard(message.payload);text(statusNode,'DopaHQ ready.')}else{renderDashboard(null);text(statusNode,message.error==='MEMBER_LOGIN_REQUIRED'?'Sign in through Account to continue.':(message.error||'Dashboard unavailable.'))}return}text(statusNode,message.ok?'Rabbit Hole ready.':(message.error==='MEMBER_LOGIN_REQUIRED'?'Sign in through Account to continue.':(message.error||'Action failed')));if(message.payload?.found!==undefined){text(count,message.payload.found+' / '+message.payload.required);const percent=Math.min(100,Math.round((Number(message.payload.found)||0)/Math.max(1,Number(message.payload.required)||1)*100));bar.style.width=percent+'%';bar.parentElement.setAttribute('aria-valuenow',String(percent));c.disabled=!message.payload.caveUnlocked;c.title=message.payload.caveUnlocked?'Enter the unlocked cave':'Find all 50 hidden buttons to unlock the cave'}});send('dashboard');
</script></body></html>
