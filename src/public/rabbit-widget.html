<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif;color:#fff}.gem{position:absolute;right:12px;bottom:12px;width:42px;height:42px;padding:0;border:1px solid #fff8;border-radius:50% 50% 45% 55%;background:linear-gradient(135deg,#b6ff00 0 32%,#7a00ff 33% 62%,#ff00aa 63%);box-shadow:inset -3px -3px 0 #fff8,2px 3px 0 #ff00aa;transform:rotate(18deg);cursor:pointer}.gem:after{content:'◆';font-size:20px;color:#fff;position:absolute;inset:0;display:grid;place-items:center;transform:rotate(-18deg);text-shadow:0 1px 2px #09090d}.panel{display:none;position:absolute;right:12px;bottom:12px;width:min(290px,calc(100% - 24px));padding:14px 16px;border:2px solid #ff00aa;box-shadow:6px 6px #7a00ff;background:#09090df2;border-radius:12px;box-sizing:border-box}.panel.open{display:block}.panel strong{color:#fff200}.panel p{font-size:13px;margin:5px 0 9px}.row{display:flex;gap:7px;flex-wrap:wrap}.row button{padding:8px 10px;border-radius:7px;background:#fff200;color:#09090d;border:1px solid #fff;font-weight:800;cursor:pointer}.signin{background:#37aaff!important}.reset{background:#15111c!important;color:#fff!important}.close{float:right;background:none!important;color:#fff!important;border:0!important;font-size:18px!important;padding:0!important}
</style></head><body><button class="gem" id="g" aria-label="Open Rabbit Hole"></button><section class="panel" id="p"><button class="close" id="x" aria-label="Close Rabbit Hole">×</button><strong>THE RABBIT HOLE</strong><p>Find the 50 restless forest buttons. Member progress is saved securely.</p><p>Already a member? <button class="signin" id="s">Sign In</button></p><div id="count" style="color:#fff200;font-weight:bold;margin:7px 0">0 / 50</div><div class="row"><button id="c">Enter cave</button><button id="f">Forest</button><button id="d">30-day clue</button><button class="reset" id="r">Reset test</button></div><p id="status" aria-live="polite"></p></section><script>
const send=(action)=>parent.postMessage({type:'rabbit-hole-action',action},'*');g.onclick=()=>p.classList.add('open');x.onclick=()=>p.classList.remove('open');s.onclick=()=>send('sign-in');c.onclick=()=>send('enter-cave');f.onclick=()=>send('forest');d.onclick=()=>send('daily-clue');r.onclick=()=>send('reset-test');window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='RABBIT_WIDGET_RESULT'){status.textContent=d.ok?(d.action==='reset-test'?'Test progress reset. Start at button 1.':'Action sent: '+d.action):(d.error||'Action failed');if(d.payload?.found!==undefined)count.textContent=d.payload.found+' / '+d.payload.required}});send('state');
</script></body></html>
